# https://developers.home-assistant.io/docs/add-ons/configuration
name: "EchonetGO (Dev)"
version: "0.9.43-dev.10"
slug: echonetgo_dev
description: ECHONET Lite polling service in Go. Polls devices, publishes HA entities via MQTT, and serves Prometheus metrics.
url: "https://github.com/styygeli/EchonetGO"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
host_network: true
apparmor: true
map:
  - config:ro
options:
  config_path: "/config/echonetgo/config.yaml"
  devices_path: ""
  log_level: "info"
  mqtt_broker: ""
  mqtt_username: ""
  mqtt_password: ""
schema:
  config_path: "str?"
  devices_path: "str?"
  log_level: "str?"
  mqtt_broker: "str?"
  mqtt_username: "str?"
  mqtt_password: "password?"


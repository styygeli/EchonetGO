# https://developers.home-assistant.io/docs/add-ons/configuration
name: "EchonetGO (Dev)"
version: "0.9.44-dev.11"
slug: echonetgo_dev
image: "ghcr.io/styygeli/{arch}-echonetgo_dev"
description: ECHONET Lite polling service in Go. Polls devices, publishes HA entities via MQTT, and serves Prometheus metrics.
url: "https://github.com/styygeli/EchonetGO"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
host_network: true
apparmor: true
map:
  - config:ro
options:
  devices_path: "/config/echonetgo/devices.yaml"
  log_level: "info"
  mqtt_broker: ""
  mqtt_username: ""
  mqtt_password: ""
  listen_addr: "0.0.0.0:9191"
  scrape_timeout_sec: 15
  strict_source_port_3610: true
  metrics_enabled: false
  notifications_enabled: true
  force_polling: false
  multicast_interfaces: ""
schema:
  devices_path: "str"
  log_level: "list(debug|info|warn|error)"
  mqtt_broker: "str?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  listen_addr: "str"
  scrape_timeout_sec: "int"
  strict_source_port_3610: "bool"
  metrics_enabled: "bool"
  notifications_enabled: "bool"
  force_polling: "bool"
  multicast_interfaces: "str?"


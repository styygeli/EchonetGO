# EV Charger and Discharger (電気自動車充放電器) - ECHONET Object 0x027E01
eoj: [0x02, 0x7E, 0x01]
description: "EV charger and discharger"
default_scrape_interval: 1m

metrics:
  - epc: 0x80
    name: operation_status
    help: "Operation status (0x30=ON, 0x31=OFF)."
    size: 1
    type: gauge
    enum:
      0x30: on
      0x31: off

  - epc: 0x88
    name: fault_status
    help: "Fault status."
    size: 1
    type: gauge
    enum:
      0x41: fault
      0x42: no_fault

  - epc: 0xDA
    name: operation_mode_setting
    help: "Operation mode setting (Charge/Discharge/Standby/Idle)."
    size: 1
    type: gauge
    enum:
      0x42: charge
      0x43: discharge
      0x44: standby
      0x46: charge_discharge
      0x47: idle
      0x48: preparation
      0x49: automatic
      0x40: other

  - epc: 0xE1
    name: actual_operation_mode
    help: "Operating status of EV charger/discharger."
    size: 1
    type: gauge
    enum:
      0x42: charge
      0x43: discharge
      0x44: standby
      0x47: idle
      0x48: preparation
      0x40: other

  - epc: 0xD3
    name: measured_instantaneous_charging_discharging_electric_power
    help: "Instantaneous charging/discharging electric power in W (signed)."
    size: 4
    signed: true
    type: gauge
    ha_device_class: power
    ha_state_class: measurement
    ha_unit: "W"

  - epc: 0xD4
    name: measured_instantaneous_charging_discharging_current
    help: "Instantaneous charging/discharging current in 0.1A (signed)."
    size: 2
    signed: true
    scale: 0.1
    type: gauge
    ha_device_class: current
    ha_state_class: measurement
    ha_unit: "A"

  - epc: 0xD5
    name: measured_instantaneous_charging_discharging_voltage
    help: "Instantaneous charging/discharging voltage in V."
    size: 2
    signed: true
    type: gauge
    ha_device_class: voltage
    ha_state_class: measurement
    ha_unit: "V"

  - epc: 0xD6
    name: measured_cumulative_discharging_electric_energy
    help: "Cumulative amount of discharging electric energy in Wh."
    size: 4
    type: counter
    scrape_interval: 5m
    ha_device_class: energy
    ha_state_class: total_increasing
    ha_unit: "Wh"

  - epc: 0xD8
    name: measured_cumulative_charging_electric_energy
    help: "Cumulative amount of charging electric energy in Wh."
    size: 4
    type: counter
    scrape_interval: 5m
    ha_device_class: energy
    ha_state_class: total_increasing
    ha_unit: "Wh"

  - epc: 0xE2
    name: vehicle_battery_remaining_capacity_wh
    help: "Vehicle battery remaining stored capacity in Wh."
    size: 4
    type: gauge
    ha_device_class: energy
    ha_state_class: total
    ha_unit: "Wh"

  - epc: 0xE4
    name: vehicle_battery_remaining_capacity_percent
    help: "Vehicle battery state of charge in %."
    size: 1
    type: gauge
    ha_device_class: battery
    ha_state_class: measurement
    ha_unit: "%"

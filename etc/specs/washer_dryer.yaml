# Washer and Dryer (洗濯乾燥機) - ECHONET Object 0x03D301
eoj: [0x03, 0xD3, 0x01]
description: "Washer and dryer"
default_scrape_interval: 1m

metrics:
  - epc: 0x80
    name: operation_status
    help: "Operation status (0x30=ON, 0x31=OFF)."
    size: 1
    type: gauge
    enum:
      0x30: on
      0x31: off

  - epc: 0x88
    name: fault_status
    help: "Fault status."
    size: 1
    type: gauge
    enum:
      0x41: fault
      0x42: no_fault

  - epc: 0xB0
    name: operation_mode_setting
    help: "Operation mode (0x41=Washing, 0x42=Drying, 0x43=Washing and Drying)."
    size: 1
    type: gauge
    enum:
      0x41: washing
      0x42: drying
      0x43: washing_and_drying

  - epc: 0xE2
    name: current_stage_of_washer_and_dryer_cycle
    help: "Current stage of washer and dryer cycle."
    size: 1
    type: gauge
    enum:
      0x41: washing
      0x42: rinsing
      0x43: spin_drying
      0x44: suspended
      0x45: washing_completed
      0x51: washing_drying_completed
      0x52: drying
      0x53: wrinkle_minimizing
      0x54: drying_wrinkle_minimizing_completed
      0x61: standby

  - epc: 0xEE
    name: door_cover_lock_setting
    help: "Door/cover lock state."
    size: 1
    type: gauge
    enum:
      0x41: locked
      0x42: unlocked
